[project]
name = "bloodheroes"
version = "2.0.0"
description = "Bloodheroes donation API (FastAPI + PostgreSQL/PostGIS + H3)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Maulana Yusuf", email = "im.idiiot@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "granian[reload]>=2.8",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "h3>=4.1",
    "pwdlib[argon2,bcrypt]>=0.2",
    "pyjwt>=2.9",
    "psycopg2-binary>=2.9",
    "yoyo-migrations>=9.0",
]

[project.optional-dependencies]
migration = [
    "pymongo>=4.8",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
